[project]
name = "fateweave"
version = "0.1.0"
description = "Fateweave: remote MCP marriage saju and couple compatibility reports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "korean-saju==0.3.0",
    "korean-lunar-calendar==0.4.0",
    "fastapi",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fateweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

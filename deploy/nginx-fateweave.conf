# Fateweave vhost for the EXISTING host Nginx (drop into conf.d/ or sites-available/).
# Replace ${FATEWEAVE_PUBLIC_HOST} with the real host name (e.g. `envsubst '${FATEWEAVE_PUBLIC_HOST}'
# < nginx-fateweave.conf > /etc/nginx/conf.d/fateweave.conf`); no domain is assumed here.
# Test with `nginx -t` and reload (`nginx -s reload`); do not touch other vhosts.

# Access log WITHOUT request headers (so the X-Fateweave-Key secret and any other header never
# reach the log) and without query strings. log_format lives at http level; this file is included
# there. The name is unique to avoid clashing with existing formats.
log_format fateweave_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                          'rt=$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name ${FATEWEAVE_PUBLIC_HOST};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${FATEWEAVE_PUBLIC_HOST};

    # TLS: placeholders. An existing certificate may be reused ONLY if its SANs cover
    # ${FATEWEAVE_PUBLIC_HOST} (check: openssl x509 -in <cert> -noout -ext subjectAltName).
    # Otherwise issue a dedicated certificate for this host.
    ssl_certificate     /etc/ssl/fateweave/fullchain.pem;   # placeholder path
    ssl_certificate_key /etc/ssl/fateweave/privkey.pem;     # placeholder path
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/fateweave.access.log fateweave_safe;
    error_log  /var/log/nginx/fateweave.error.log warn;

    client_max_body_size 1m;

    # MCP Streamable HTTP (POST JSON / SSE streaming). X-Fateweave-Key passes through by default.
    location /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    location / {
        return 404;
    }
}
